name: End-to-end

# Signs in as the demo personas on the work-in-progress site and walks the registration flow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test (blank = the work-in-progress site)
        required: false
        default: ''
  workflow_run:
    workflows: [Deploy]
    branches: [main]
    types: [completed]

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      ACT_URL: ${{ github.event.inputs.url || 'https://main.agent-control-tower-56p.pages.dev' }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Temporary agent key
        # The approver-task test asks for a £2m payment as the Payment Release Assistant, through the public API.
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          key=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "begin;
            select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
            from public.profiles where email = 'admin@northbridge.demo';
            select public.create_agent_api_key(id) from public.agents where name = 'Payment Release Assistant';
            commit;" | grep '^act_')
          [ -n "$key" ] || { echo "::error::Could not make an agent key; run Seed demo data for dev first"; exit 1; }
          echo "::add-mask::$key"
          echo "ACT_AGENT_KEY=$key" >> "$GITHUB_ENV"
      - name: Run
        run: npx playwright test > out.log 2>&1 || { cat out.log; echo "::error title=E2E failed::$(grep -E '✘|Error:|expect' out.log | head -n 8 | tr '\n' ' ')"; exit 1; }
      - run: cat out.log
        if: success()
      - name: Retire leftover test agents
        if: always()
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v agent_key="$ACT_AGENT_KEY" <<'SQL'
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
          from public.profiles where email = 'admin@northbridge.demo';
          select public.retire_agent(id, 'Test agent left by an interrupted test run')
          from public.agents where status <> 'retired' and (name like 'E2E agent %' or name like 'API test agent %');
          commit;
          delete from public.routing_rules where name like 'E2E rule %';
          -- The key made for this run, and any test request left waiting.
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
          from public.profiles where email = 'admin@northbridge.demo';
          select public.revoke_api_key(id) from public.agent_api_keys
           where key_hash = public.secret_hash(:'agent_key') and revoked_at is null;
          commit;
          update public.action_requests set status = 'cancelled', decided_at = now(), decision_reason = 'Test request left by an interrupted test run'
           where status = 'pending' and description like 'Release £2,000,000 to supplier E2E %';
          -- Test people exist only on the work-in-progress database; remove them entirely.
          delete from auth.users where email like 'e2e.user.%@northbridge.demo';
          SQL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
