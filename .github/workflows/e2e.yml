name: End-to-end

# Signs in as the demo personas on the work-in-progress site and walks the registration flow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test (blank = the work-in-progress site)
        required: false
        default: ''
  workflow_run:
    workflows: [Deploy]
    branches: [main]
    types: [completed]

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the time-limit test (task 2.9) waits about 4 minutes in real time
    environment: dev
    env:
      ACT_URL: ${{ github.event.inputs.url || 'https://main.agent-control-tower-56p.pages.dev' }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The phone-alert test (task 2.6) runs in Google Chrome; GitHub's Ubuntu runners usually have it already.
      - run: command -v google-chrome >/dev/null || npx playwright install chrome
      - name: Temporary agent key
        # The approver-task test asks for a £2m payment as the Payment Release Assistant, through the public API.
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          key=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "begin;
            select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
            from public.profiles where email = 'admin@northbridge.demo';
            select public.create_agent_api_key(id) from public.agents where name = 'Payment Release Assistant';
            commit;" | grep '^act_')
          [ -n "$key" ] || { echo "::error::Could not make an agent key; run Seed demo data for dev first"; exit 1; }
          echo "::add-mask::$key"
          echo "ACT_AGENT_KEY=$key" >> "$GITHUB_ENV"
          # Its code (e.g. AGT-0001), for the £2m payment story test (task 2.12): status check and check-in by code.
          code=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select agent_code from public.agents where name = 'Payment Release Assistant'")
          echo "ACT_AGENT_CODE=$code" >> "$GITHUB_ENV"
          # Bulk approval test (task 2.10): a key for the Branch Rota Planner (low risk).
          low=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "begin;
            select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
            from public.profiles where email = 'admin@northbridge.demo';
            select public.create_agent_api_key(id) from public.agents where name = 'Branch Rota Planner' and status = 'live';
            commit;" | grep '^act_' || true)
          if [ -n "$low" ]; then echo "::add-mask::$low"; echo "ACT_LOW_AGENT_KEY=$low" >> "$GITHUB_ENV"; else echo "::warning::Branch Rota Planner is not live; the bulk test will be skipped"; fi
          # Kill switch test (task 4.1): the Mail Room Router, put back to Live first if an earlier run stopped half way,
          # and a key so the test can ask, as the agent, whether it may act.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "begin;
            select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                   set_config('act.reason', 'Kill switch test: put back to Live before the test run', true);
            update public.agents set status = 'live' where name = 'Mail Room Router' and status = 'suspended';
            commit;"
          ks=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "begin;
            select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
            from public.profiles where email = 'admin@northbridge.demo';
            select public.create_agent_api_key(id) from public.agents where name = 'Mail Room Router' and status = 'live';
            commit;" | grep '^act_' || true)
          if [ -n "$ks" ]; then
            echo "::add-mask::$ks"; echo "ACT_KS_AGENT_KEY=$ks" >> "$GITHUB_ENV"
            echo "ACT_KS_AGENT_CODE=$(psql "$SUPABASE_DB_URL" -tA -c "select agent_code from public.agents where name = 'Mail Room Router'")" >> "$GITHUB_ENV"
          else echo "::warning::Mail Room Router is not live; the kill switch test will be skipped"; fi
      - name: Agent to retire (task 5.5)
        # Retiring is final, so each run retires a fresh registry agent, linked here to NAP-006 (Treasury Cash Forecaster)
        # on the Appian simulator, which no other test uses. NAP-006 is switched on in Appian first, and again after the run.
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          [ -n "$APPIAN_API_KEY" ] || { echo "::warning::APPIAN_API_KEY is not set; the retire test will be skipped"; exit 0; }
          curl -sS -o /dev/null -w "NAP-006 switched on: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-006","status":"active","reason":"Control Tower test run: switched on before the retire test","requestedBy":"act-integration"}'
          code=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 <<'SQL' | tail -n 1
          begin;
          update public.platform_agents set status = 'active' where external_id = 'NAP-006';
          with owner as (select id from public.profiles where email = 'admin@northbridge.demo'),
               fresh as (insert into public.agents (name, purpose_statement, business_owner_id, created_by)
                         select 'E2E retire ' || to_char(now(), 'YYYYMMDD-HH24MISS'), 'Retire test (task 5.5)', id, id from owner
                         returning id)
          update public.platform_agents set agent_id = (select id from fresh) where external_id = 'NAP-006';
          commit;
          select a.agent_code from public.agents a join public.platform_agents p on p.agent_id = a.id where p.external_id = 'NAP-006';
          SQL
          )
          if echo "$code" | grep -qE '^AGT-[0-9]{4}$'; then echo "ACT_RETIRE_AGENT_CODE=$code" >> "$GITHUB_ENV"; echo "Agent to retire: $code (NAP-006)"
          else echo "::warning::could not set up the agent to retire: $code"; fi
      - name: Platform agent for the enforcement test
        # Task 4.2: the registry agent linked to NAP-001 (Refund Processor) on the Appian simulator, made Live on this
        # work-in-progress database only, and NAP-001 switched back on in Appian if an earlier run stopped half way.
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          [ -n "$APPIAN_API_KEY" ] || { echo "::warning::APPIAN_API_KEY is not set; the enforcement test will be skipped"; exit 0; }
          curl -sS -o /dev/null -w "NAP-001 switched on: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-001","status":"active","reason":"Control Tower test run: switched back on before the test","requestedBy":"act-integration"}'
          code=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 <<'SQL' | tail -n 1
          begin;
          select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                 set_config('act.reason', 'Enforcement test: test agent made Live on the work-in-progress database', true);
          update public.platform_agents set status = 'active' where external_id = 'NAP-001';
          -- Task 4.6: earlier runs' leftovers would block "Ask to switch back on".
          update public.incidents set status = 'contained', containment = coalesce(containment, 'Earlier test run'), contained_at = now()
           where agent_id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and status = 'open';
          update public.agent_reactivations set status = 'withdrawn', decided_at = now(), decision_reason = 'Earlier test run'
           where agent_id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and status = 'pending';
          update public.agents set purpose_statement = 'Issue customer refunds under £500 (test agent for the kill switch)'
           where id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and btrim(purpose_statement) = '';
          update public.agents set status = 'approved', approved_at = now(), next_review_date = current_date + 180
           where id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and status = 'proposed';
          update public.agents set status = 'live'
           where id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and status in ('approved', 'suspended');
          -- Task 4.9: reviews forced on the test agents by earlier runs' incidents (also settled after each run).
          update public.agents set review_required_reason = null, review_required_at = null, next_review_date = current_date + 180
           where review_required_at is not null
             and (name in ('Mail Room Router', 'Invoice Matcher')
                  or id = (select agent_id from public.platform_agents where external_id = 'NAP-001'));
          update public.alerts set resolved_at = now()
           where kind = 'review_required' and resolved_at is null
             and agent_id in (select id from public.agents where name in ('Mail Room Router', 'Invoice Matcher')
                              union select agent_id from public.platform_agents where external_id = 'NAP-001');
          commit;
          select a.agent_code from public.agents a join public.platform_agents pa on pa.agent_id = a.id
           where pa.external_id = 'NAP-001' and a.status = 'live';
          SQL
          )
          if echo "$code" | grep -qE '^AGT-[0-9]{4}$'; then echo "ACT_PLATFORM_AGENT_CODE=$code" >> "$GITHUB_ENV"; echo "Test agent: $code"
          else echo "::warning::No Live agent linked to NAP-001; the enforcement test will be skipped"; fi
      - name: Run
        # xvfb-run gives the phone-alert test's Chrome window a virtual screen.
        run: xvfb-run --auto-servernum npx playwright test > out.log 2>&1 || { cat out.log; echo "::error title=E2E failed::$(grep -E '✘|Error:|expect|Received|Expected|unexpected value|waiting for' out.log | head -n 24 | tr '\n' ' ')"; exit 1; }
      - name: Results
        if: success()
        run: |
          cat out.log
          # Timings the tests print (e.g. task 2.5: how fast a new task reached the approver's screen), as a notice.
          t=$(grep -oE '\[(desktop|phone)\] task appeared [0-9]+ ms[^;]*|\[(desktop|phone)\] notification arrived [0-9]+ ms[^;]*|\[push\] alert arrived: .*|\[callback\] agent heard the decision [0-9]+ ms|\[heartbeat\] silent flag after [0-9]+ s|\[(desktop|phone)\] £2m story: .*|\[killswitch\] agent refused [0-9]+ ms|\[incident\] [^;]*|\[incident-case\] [^;]*|\[reactivation\] [^;]*|\[authority\] [^;]*|\[enforcement\] [^;]*|\[alert-routing\] [^;]*|\[reactivation-email\] [^;]*|\[retire\] [^;]*' out.log | tr '\n' ';' || true)
          [ -z "$t" ] || echo "::notice title=Timings::$t"
      - name: Retry check (task 4.3)
        # Appian "goes down" for this work-in-progress database only (its connection points at an address that does not
        # exist), the NAP-001 agent is suspended, and the block must wait for a retry with the admins alerted. Then Appian
        # "comes back" and the retry must block NAP-001 by itself. The real address is always put back.
        id: retry
        # Runs even when a browser test failed (e.g. the 2-second live list on a slow day), so this check is not hidden.
        if: "!cancelled() && env.ACT_PLATFORM_AGENT_CODE != ''"
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          set -euo pipefail
          q() { psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "$1"; }
          conn=$(q "select connection_id from public.platform_agents where external_id = 'NAP-001'")
          agent=$(q "select agent_id from public.platform_agents where external_id = 'NAP-001'")
          real=$(q "select base_url from public.platform_connections where id = '$conn'")
          point() { psql "$SUPABASE_DB_URL" -q -v ON_ERROR_STOP=1 -c "begin; select set_config('act.actor_type', 'system', true),
            set_config('act.reason', 'Retry test: $2', true); update public.platform_connections set base_url = '$1' where id = '$conn'; commit;"; }
          trap 'point "$real" "Appian address put back"' EXIT
          curl -sS -o /dev/null -w "NAP-001 switched on: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-001","status":"active","reason":"Control Tower retry test: switched on before the test","requestedBy":"act-integration"}'
          point 'https://act-retry-test.invalid' 'Appian made unreachable'
          psql "$SUPABASE_DB_URL" -q -v ON_ERROR_STOP=1 <<SQL
          begin;
          select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                 set_config('act.reason', 'Retry test: test agent made Live again', true);
          update public.agents set status = 'live' where id = '$agent' and status = 'suspended';
          update public.platform_agents set status = 'active' where external_id = 'NAP-001';
          commit;
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
            from public.profiles where email = 'admin@northbridge.demo';
          select public.suspend_agent('$agent', 'E2E retry test: suspended while Appian cannot be reached');
          commit;
          SQL
          step="select status || ' ' || attempts from public.agent_enforcements where agent_id = '$agent' and method = 'platform' order by id desc limit 1"
          for i in $(seq 1 45); do s=$(q "$step"); [ "${s%% *}" = pending ] && [ "${s##* }" -ge 1 ] && break; sleep 2; done
          echo "First try: $s; $(q "select detail from public.agent_enforcements where agent_id = '$agent' and method = 'platform' order by id desc limit 1")"
          [ "${s%% *}" = pending ] && [ "${s##* }" -ge 1 ] || { echo "::error title=Retry check::the failed block was not kept for a retry ($s)"; exit 1; }
          alert=$(q "select message from public.alerts where agent_id = '$agent' and kind = 'enforcement_pending' and resolved_at is null")
          echo "Admin alert: $alert"
          [ -n "$alert" ] || { echo "::error title=Retry check::no admin alert while the block waits for a retry"; exit 1; }
          pushes=$(q "select count(*) from public.push_outbox where kind = 'alert' and title like '%Not stopped yet%' and created_at > now() - interval '5 minutes'")
          point "$real" 'Appian reachable again'
          back=$(date +%s)
          for i in $(seq 1 60); do s=$(q "$step"); [ "${s%% *}" = done ] && break; sleep 5; done
          took=$(( $(date +%s) - back ))
          [ "${s%% *}" = done ] || { echo "::error title=Retry check::still not blocked ${took} s after Appian came back ($s)"; exit 1; }
          left=$(q "select count(*) from public.alerts where agent_id = '$agent' and kind = 'enforcement_pending' and resolved_at is null")
          [ "$left" = 0 ] || { echo "::error title=Retry check::the admin alert stayed open after the block worked"; exit 1; }
          st=$(curl -sS "$APPIAN_BASE/suite/webapi/nap-agent-status?externalId=NAP-001" -H "Appian-API-Key: $APPIAN_API_KEY")
          echo "Appian says: $st"
          echo "$st" | grep -q '"quarantined"' || { echo "::error title=Retry check::Appian does not show NAP-001 blocked"; exit 1; }
          echo "::notice title=Retry check::first try failed and was kept (${s##* } tries in all); $pushes routed phone alert(s) queued; blocked in Appian ${took} s after it came back; alert cleared"
      - name: Reconciliation check (task 4.7)
        # The Retry check leaves the NAP-001 agent suspended and confirmed blocked in Appian. Here someone switches it back
        # on directly in Appian (outside Control Tower); one reconciliation cycle must block it again, read back, with a
        # Critical incident, an "actor unknown" audit record and admin alerts. The cycle is started at once here instead
        # of waiting for the 5-minute clock (the step checks the clock is scheduled too).
        if: "!cancelled() && steps.retry.outcome == 'success'"
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          set -euo pipefail
          q() { psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "$1"; }
          agent=$(q "select agent_id from public.platform_agents where external_id = 'NAP-001'")
          conn=$(q "select connection_id from public.platform_agents where external_id = 'NAP-001'")
          [ "$(q "select status from public.agents where id = '$agent'")" = suspended ] || { echo "::warning title=Reconciliation check::the test agent is not suspended; skipped"; exit 0; }
          echo "Clock: $(q "select schedule from cron.job where jobname = 'platform-reconcile'")"
          for i in $(seq 1 30); do n=$(q "select count(*) from public.reconcile_targets('$conn') where external_id = 'NAP-001'"); [ "$n" = 1 ] && break; sleep 2; done
          [ "$n" = 1 ] || { echo "::error title=Reconciliation check::NAP-001 never became a reconciliation target (block not confirmed)"; exit 1; }

          curl -sS -o /dev/null -w "NAP-001 switched on directly in Appian: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-001","status":"active","reason":"E2E: switched back on outside Control Tower","requestedBy":"act-integration"}'
          started=$(date +%s)
          q "select public.platform_reconcile_due()" >/dev/null
          step="select status from public.agent_enforcements where agent_id = '$agent' and cause = 'reblock' and created_at > now() - interval '5 minutes' order by id desc limit 1"
          for i in $(seq 1 45); do s=$(q "$step"); [ "$s" = done ] && break; sleep 2; done
          took=$(( $(date +%s) - started ))
          [ "$s" = done ] || { echo "::error title=Reconciliation check::not blocked again ${took} s into the cycle (re-block step: ${s:-none}; job: $(q "select message from public.platform_jobs where kind = 'reconcile' order by id desc limit 1"))"; exit 1; }
          st=$(curl -sS "$APPIAN_BASE/suite/webapi/nap-agent-status?externalId=NAP-001" -H "Appian-API-Key: $APPIAN_API_KEY")
          echo "Appian says: $st"
          echo "$st" | grep -q '"quarantined"' || { echo "::error title=Reconciliation check::Appian does not show NAP-001 blocked again"; exit 1; }
          inc=$(q "select incident_code || ' ' || severity from public.incidents where agent_id = '$agent' and source = 'reconciliation' and opened_at > now() - interval '5 minutes' order by opened_at desc limit 1")
          [ -n "$inc" ] || { echo "::error title=Reconciliation check::no incident opened"; exit 1; }
          audit=$(q "select summary from public.audit_events where action = 'agents.reactivated_outside' and agent_id = '$agent' and occurred_at > now() - interval '5 minutes' order by seq desc limit 1")
          echo "Audit: $audit"
          echo "$audit" | grep -q 'actor unknown' || { echo "::error title=Reconciliation check::no actor-unknown audit record"; exit 1; }
          # Task 4.9: the drift is on record with expected, observed, actor, action and result.
          drift=$(q "select concat_ws(' | ', expected, observed, actor, action, result) from public.drift_events where agent_id = '$agent' and kind = 'switched_on_outside' and detected_at > now() - interval '5 minutes' order by detected_at desc limit 1")
          echo "Drift: $drift"
          echo "$drift" | grep -q 'Blocked again and read back as blocked' || { echo "::error title=Reconciliation check::no drift record with the re-block result"; exit 1; }
          echo "$drift" | grep -q 'Unknown, outside Control Tower' || { echo "::error title=Reconciliation check::drift actor is not 'Unknown, outside Control Tower'"; exit 1; }
          pushes=$(q "select count(*) from public.push_outbox where kind = 'alert' and title like '%Blocked again%' and created_at > now() - interval '5 minutes'")
          echo "Job: $(q "select message from public.platform_jobs where kind = 'reconcile' order by id desc limit 1")"
          echo "::notice title=Reconciliation check::switched on in Appian outside Control Tower; blocked again and read back as blocked ${took} s into the cycle; incident ${inc}; audit 'actor unknown'; drift recorded; ${pushes} routed phone alert(s)"
      - name: Retire check (task 5.5)
        # The browser test retired the agent linked to NAP-006: Appian itself must now say NAP-006 is quarantined, by us.
        # Then NAP-006 is switched back on for the next run.
        if: "!cancelled() && env.ACT_RETIRE_AGENT_CODE != ''"
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          set -euo pipefail
          st=$(curl -sS "$APPIAN_BASE/suite/webapi/nap-agent-status?externalId=NAP-006" -H "Appian-API-Key: $APPIAN_API_KEY")
          echo "Appian says: $st"
          curl -sS -o /dev/null -w "NAP-006 switched back on: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-006","status":"active","reason":"Control Tower test run: switched back on after the retire test","requestedBy":"act-integration"}'
          echo "$st" | grep -q '"quarantined"' || { echo "::error title=Retire check::NAP-006 is not blocked in Appian after $ACT_RETIRE_AGENT_CODE was retired"; exit 1; }
          echo "$st" | grep -q '"act-integration"' || { echo "::error title=Retire check::Appian does not show the Control Tower as the one who blocked NAP-006"; exit 1; }
          echo "::notice title=Retire check::$ACT_RETIRE_AGENT_CODE retired; Appian itself reads NAP-006 as quarantined, by the Control Tower (act-integration); switched back on for the next run"
      - name: Alert emails check (task 5.1)
        # The run suspends agents, switches them back on, blocks one again after it is switched on in Appian, and makes a
        # stop wait for a retry: each must have queued an alert email to the admin, carrying the agent's owner, the people
        # who can use it and its data. On this site they go to Resend's test inbox, 20 a day at most.
        if: "!cancelled() && steps.retry.outcome == 'success'"
        run: |
          set -euo pipefail
          q() { psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "$1"; }
          since="now() - interval '45 minutes'"
          admin=$(q "select id from public.profiles where email = 'admin@northbridge.demo'")
          missing=""
          for ev in suspended reactivated re_quarantined enforcement_pending; do
            n=$(q "select count(*) from public.email_outbox where kind = 'alert' and event = '$ev' and user_id = '$admin' and created_at > $since
                     and details ? 'people' and details ? 'data' and details ? 'owner' and jsonb_array_length(details -> 'facts') > 0")
            [ "$n" -gt 0 ] || missing="$missing $ev"
          done
          [ -z "$missing" ] || { echo "::error title=Alert emails check::no alert email to the admin for:$missing"; exit 1; }
          summary=$(q "select string_agg(event || ' ' || n || ' (' || statuses || ')', '; ' order by event) from (
                         select event, count(*) n, string_agg(distinct coalesce(case when result = 'Sent' and is_test then 'sent to test inbox' else result end, 'sending'), ', ') statuses
                           from public.email_outbox where kind = 'alert' and created_at > $since group by event) x")
          echo "::notice title=Alert emails check::$summary"
      - name: Retire leftover test agents
        if: always()
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v agent_key="$ACT_AGENT_KEY" -v low_key="${ACT_LOW_AGENT_KEY:-none}" <<'SQL'
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
          from public.profiles where email = 'admin@northbridge.demo';
          select public.retire_agent(id, 'Test agent left by an interrupted test run')
          from public.agents where status <> 'retired' and (name like 'E2E agent %' or name like 'API test agent %');
          commit;
          delete from public.routing_rules where name like 'E2E rule %';
          delete from public.alert_routes where name like 'E2E route %'; -- task 5.2
          -- The key made for this run, and any test request left waiting.
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', id, 'role', 'authenticated')::text, true)
          from public.profiles where email = 'admin@northbridge.demo';
          select public.revoke_api_key(id) from public.agent_api_keys
           where key_hash in (public.secret_hash(:'agent_key'), public.secret_hash(:'low_key')) and revoked_at is null;
          -- Kill switch test (task 4.1): revoke its keys, then put the Mail Room Router back to Live.
          select public.revoke_api_key(k.id) from public.agent_api_keys k join public.agents a on a.id = k.agent_id
           where a.name = 'Mail Room Router' and k.revoked_at is null;
          -- Silent-agent test (task 2.11): stop watching the Regulatory Change Summariser and revoke its test keys.
          select public.set_agent_silence_limit(id, null) from public.agents
           where name = 'Regulatory Change Summariser' and silent_after_minutes is not null;
          select public.revoke_api_key(k.id) from public.agent_api_keys k join public.agents a on a.id = k.agent_id
           where a.name = 'Regulatory Change Summariser' and k.revoked_at is null;
          commit;
          update public.action_requests set status = 'cancelled', decided_at = now(), decision_reason = 'Test request left by an interrupted test run'
           where status = 'pending' and (description like 'Release £% to supplier E2E %'
                                         or description like 'Publish next week''s staff rota for the E2E %');
          begin;
          select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                 set_config('act.reason', 'Kill switch test finished: put back to Live by the test run', true);
          update public.agents set status = 'live' where name = 'Mail Room Router' and status = 'suspended';
          commit;
          -- Enforcement test (task 4.2): the NAP-001 agent back to Live (it is switched back on in Appian below).
          begin;
          select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                 set_config('act.reason', 'Enforcement test finished: put back to Live by the test run', true);
          update public.agents set status = 'live'
           where id = (select agent_id from public.platform_agents where external_id = 'NAP-001') and status = 'suspended';
          update public.platform_agents set status = 'active' where external_id = 'NAP-001';
          commit;
          -- Incident rules (task 4.9): every run reports incidents on its test agents, so "3 incidents in 90 days" forces
          -- a review on them each time. Settle it after the run, so the registry's demo counts (overdue reviews) hold.
          begin;
          select set_config('act.allow_lifecycle', 'on', true), set_config('act.actor_type', 'system', true),
                 set_config('act.reason', 'Test run finished: review required by test incidents settled', true);
          update public.agents set review_required_reason = null, review_required_at = null, next_review_date = current_date + 180
           where review_required_at is not null
             and (name in ('Mail Room Router', 'Invoice Matcher')
                  or id = (select agent_id from public.platform_agents where external_id = 'NAP-001'));
          update public.alerts set resolved_at = now()
           where kind = 'review_required' and resolved_at is null
             and agent_id in (select id from public.agents where name in ('Mail Room Router', 'Invoice Matcher')
                              union select agent_id from public.platform_agents where external_id = 'NAP-001');
          commit;
          -- Phone-alert test (task 2.6): the test browser's device, if the test stopped before turning alerts off.
          delete from public.push_subscriptions s using public.profiles p
           where p.id = s.user_id and p.email = 'ravi.menon@northbridge.demo' and s.device like 'Linux · Chrome%';
          -- Test people exist only on the work-in-progress database; remove them entirely.
          delete from auth.users where email like 'e2e.user.%@northbridge.demo';
          SQL
      - name: Switch NAP-001 back on in Appian
        if: always()
        env:
          APPIAN_BASE: ${{ vars.APPIAN_BASE || 'https://appbay-demo.appiancloud.com' }}
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
        run: |
          [ -n "$APPIAN_API_KEY" ] || exit 0
          curl -sS -o /dev/null -w "NAP-001 switched on: HTTP %{http_code}\n" -X POST "$APPIAN_BASE/suite/webapi/nap-agent-status-set" \
            -H "Appian-API-Key: $APPIAN_API_KEY" -H 'content-type: application/json' \
            -d '{"externalId":"NAP-001","status":"active","reason":"Control Tower test run finished: switched back on","requestedBy":"act-integration"}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
