name: Deploy

# main -> preview link (act-dev database)
# demo -> production link (act-demo database), the one shown to clients
on:
  push:
    branches: [main, demo]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'demo' && 'demo' || 'dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'agent-control-tower' }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set as a repository secret"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_ENV: ${{ github.ref_name == 'demo' && 'demo' || 'dev' }}
      - name: Upload to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch="${{ github.ref_name }}" --commit-dirty=true
