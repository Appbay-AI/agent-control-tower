name: Seed demo data

# Loads the Northbridge Bank personas and agents. Safe to run again: existing data is left alone,
# and every persona's password is reset to DEMO_USER_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database to seed
        type: choice
        options: [dev, demo]
        default: dev
      reset:
        description: Clear all agents and history first, then reload (demo data only; logins and roles are kept)
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.target }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL is not set for this environment"; exit 1; }
          [ ${#DEMO_USER_PASSWORD} -ge 12 ] || { echo "::error::DEMO_USER_PASSWORD repository secret is missing or shorter than 12 characters"; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version
      - name: Personas
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v demo_password="$DEMO_USER_PASSWORD" -f supabase/seed/01_users.sql > out.log 2>&1 \
            || { cat out.log; echo "::error title=Personas failed::$(tail -n 6 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
      - name: Reset demo data
        if: github.event.inputs.reset == 'true'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed/90_reset.sql > out.log 2>&1 \
            || { cat out.log; echo "::error title=Reset failed::$(tail -n 6 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
      - name: Northbridge Bank
        run: |
          # One session, so the helpers in 00_helpers.sql are visible to the data files.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed/00_helpers.sql -f supabase/seed/02_demo_bank.sql \
            -f supabase/seed/03_more_agents.sql -f supabase/seed/04_routing.sql -f supabase/seed/05_action_requests.sql > out.log 2>&1 \
            || { cat out.log; echo "::error title=Demo bank failed::$(tail -n 8 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
          echo "::notice title=Agents by status::$(tail -n 8 out.log | tr '\n' ' ')"
