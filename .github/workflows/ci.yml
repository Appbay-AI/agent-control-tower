name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local API config
        run: cp -n functions-lib/config.example.js functions-lib/config.js
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database tests
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Demo agents (task 7.2)
        run: |
          python3 -m venv /tmp/agents && /tmp/agents/bin/pip install -q -r demo-agents/requirements.txt
          /tmp/agents/bin/python -m unittest discover -s demo-agents -v
