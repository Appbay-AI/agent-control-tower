name: Database migrations

# Development gets every migration merged to main automatically.
# The demo database changes only when someone runs this workflow by hand,
# so a half-finished change never reaches a client meeting.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Which database to update
        type: choice
        options: [dev, demo]
        default: dev
      alerts_site:
        description: 'Optional: site that sends phone alerts (to test a branch preview on dev). Blank = the normal site.'
        required: false
        default: ''
      email_redirect_to:
        description: 'Optional: inbox that receives every approval email (temporary/demo mode). Kept once set.'
        required: false
        default: ''

concurrency:
  group: db-migrate-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Preferred: the Session pooler connection string (Supabase → Connect). Needs no access token.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            case "$SUPABASE_DB_URL" in
              postgres://*|postgresql://*) echo "Using the database connection string" ;;
              *) echo "::error::SUPABASE_DB_URL must start with postgresql://"; exit 1 ;;
            esac
            exit 0
          fi
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set for this environment"; missing=1; fi
          done
          exit $missing
      - name: Check connection string (no secrets shown)
        if: env.SUPABASE_DB_URL != ''
        run: |
          python3 - <<'PY'
          import os, hashlib, urllib.parse as u
          url = u.urlparse(os.environ['SUPABASE_DB_URL'])
          pw_url = u.unquote(url.password or '')
          pw = os.environ.get('SUPABASE_DB_PASSWORD', '')
          fp = lambda s: hashlib.sha256(s.encode()).hexdigest()[:8]
          print(f"::notice title=Connection string::user={url.username} host={url.hostname} port={url.port} "
                f"password length={len(pw_url)} fingerprint={fp(pw_url)}; SUPABASE_DB_PASSWORD length={len(pw)} "
                f"fingerprint={fp(pw)}; match={pw_url == pw}; placeholder left={'YOUR-PASSWORD' in os.environ['SUPABASE_DB_URL']}")
          PY
      - name: Check access token
        if: env.SUPABASE_DB_URL == ''
        run: |
          one=$(curl -s -o project.json -w '%{http_code}' "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          test "$one" = "200" || { echo "::error title=Access token::Supabase refused the token for $PROJECT_REF (HTTP $one): $(head -c 200 project.json)"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Each step reports its last lines as an annotation on failure, so the cause is visible
      # without opening the raw log.
      - name: Link project
        if: env.SUPABASE_DB_URL == ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.log 2>&1 \
            || { cat out.log; echo "::error title=Link failed::$(tail -n 5 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
      - name: Show pending migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then target=(--db-url "$SUPABASE_DB_URL"); else target=(--password "$SUPABASE_DB_PASSWORD"); fi
          supabase migration list "${target[@]}" > out.log 2>&1 \
            || { cat out.log; echo "::error title=Connect failed::$(tail -n 6 out.log | sed -E 's#postgres(ql)?://[^ ]*#postgresql://***#g' | tr '\n' ' ')"; exit 1; }
          cat out.log
      - name: Apply migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then target=(--db-url "$SUPABASE_DB_URL"); else target=(--password "$SUPABASE_DB_PASSWORD"); fi
          # --yes: since early Nov 2026 the CLI asks for confirmation and refuses when it cannot (no terminal here).
          supabase db push --yes "${target[@]}" > out.log 2>&1 \
            || { cat out.log; echo "::error title=Migration failed::$(tail -n 8 out.log | sed -E 's#postgres(ql)?://[^ ]*#postgresql://***#g' | tr '\n' ' ')"; exit 1; }
          cat out.log
      # Tasks 2.6 and 2.7: phone alerts and approval emails. Points the database at this environment's site, creates the
      # alert signing keys once, and stores the Resend key (secret RESEND_API_KEY) and email settings.
      - name: Phone alert and email settings
        env:
          TARGET: ${{ github.event.inputs.target || 'dev' }}
          SITE_URL: ${{ github.event.inputs.alerts_site }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_REDIRECT_TO: ${{ github.event.inputs.email_redirect_to || vars.EMAIL_REDIRECT_TO }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::warning title=Phone alerts::SUPABASE_DB_URL is not set, so alert keys were not checked"; exit 0; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          node scripts/push-setup.mjs > out.log 2>&1 || { cat out.log; echo "::error title=Alert and email settings::$(tail -n 3 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
          echo "::notice title=Phone alerts::$(grep '^Alerts:' out.log | tail -n 1)"
          echo "::notice title=Email::$(grep '^Email:' out.log | tail -n 1)"
      # Task 3.2: the connection to the Appian agent-platform simulator. The API key comes from the repository secret
      # APPIAN_API_KEY and goes straight into the database; the site address from the variable APPIAN_BASE if set.
      - name: Platform connections
        env:
          APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
          APPIAN_BASE: ${{ vars.APPIAN_BASE }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::warning title=Platforms::SUPABASE_DB_URL is not set, so the platform connection was not stored"; exit 0; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          node scripts/platform-setup.mjs > out.log 2>&1 || { cat out.log; echo "::error title=Platform connections::$(tail -n 3 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
          echo "::notice title=Platforms::$(grep '^Platforms:' out.log | tail -n 1)"
