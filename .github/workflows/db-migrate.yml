name: Database migrations

# Development gets every migration merged to main automatically.
# The demo database changes only when someone runs this workflow by hand,
# so a half-finished change never reaches a client meeting.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Which database to update
        type: choice
        options: [dev, demo]
        default: dev

concurrency:
  group: db-migrate-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Check access token
        run: |
          all=$(curl -s -o projects.json -w '%{http_code}' https://api.supabase.com/v1/projects \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          one=$(curl -s -o project.json -w '%{http_code}' "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          visible=$(python3 -c "import json;d=json.load(open('projects.json'));print(','.join(p.get('ref','?') for p in d) if isinstance(d,list) else d)" 2>/dev/null)
          echo "::notice title=Access token::token prefix ${SUPABASE_ACCESS_TOKEN:0:4}, length ${#SUPABASE_ACCESS_TOKEN}; list projects HTTP $all, sees [$visible]; this project HTTP $one"
          test "$one" = "200" || { echo "::error title=Access token::Supabase refused the token for $PROJECT_REF (HTTP $one): $(head -c 200 project.json)"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check configuration
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set for this environment"; missing=1; fi
          done
          exit $missing
      # Each step reports its last lines as an annotation on failure, so the cause is visible
      # without opening the raw log.
      - name: Link project
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.log 2>&1 \
            || { cat out.log; echo "::error title=Link failed::$(tail -n 5 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD" > out.log 2>&1 \
            || { cat out.log; echo "::error title=Migration failed::$(tail -n 8 out.log | tr '\n' ' ')"; exit 1; }
          cat out.log
