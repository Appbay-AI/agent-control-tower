name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity.
# This reads one row from each database every 3 days.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [dev, demo]
    environment: ${{ matrix.target }}
    steps:
      - name: Read heartbeat
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY not set for ${{ matrix.target }}; skipping"
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' \
            "$URL/rest/v1/system_heartbeat?select=checked_at&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $code: $(cat body.json)"
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.target }} heartbeat returned HTTP $code: $(head -c 300 body.json)"
            exit 1
          fi
